[package]
name = "dstok-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Private differential fuzz targets for dstok"
publish = false

[dependencies]
dstok-core = { version = "0.1.0", path = "../dstok-core" }
dstok-fast = { version = "0.1.0", path = "../dstok-fast" }
dstok-model = { version = "0.1.0", path = "../dstok-model" }
dstok-oracle = { version = "0.1.0", path = "../dstok-oracle" }
libfuzzer-sys = { version = "0.4.13", optional = true }

[features]
default = []
# libFuzzer entry points (cargo-fuzz). Pulls in the libfuzzer-sys runtime.
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "glm52-parity-fuzz"
path = "src/bin/glm52_parity.rs"
test = false
doc = false
required-features = ["libfuzzer"]
