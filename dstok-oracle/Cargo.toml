[package]
name = "dstok-oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Private Hugging Face conformance oracle for dstok"
publish = false

[dependencies]
dstok-model = { version = "0.1.0", path = "../dstok-model" }
blake3.workspace = true

# The real, pinned HF reference is enabled by default for conformance gates.
tokenizers = { version = "=0.23.1", optional = true, default-features = false, features = ["onig"] }

[features]
default = ["hf"]
hf = ["dep:tokenizers"]

[dev-dependencies]
dstok = { version = "0.1.0", path = ".." }
dstok-core = { version = "0.1.0", path = "../dstok-core" }
dstok-fast = { version = "0.1.0", path = "../dstok-fast" }
proptest.workspace = true
serde_json.workspace = true
