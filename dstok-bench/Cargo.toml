[package]
name = "dstok-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Private correctness-gated benchmark harness for dstok"
publish = false

[dependencies]
dstok-core = { version = "0.1.0", path = "../dstok-core" }
dstok-fast = { version = "0.1.0", path = "../dstok-fast" }
dstok-model = { version = "0.1.0", path = "../dstok-model" }
libc = "0.2.189"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
